name: Docker Packages

on:
  push:
    branches: [main]
    tags: ['podux-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: podux
            file: Dockerfile
          - component: podux-frpc
            file: deploy/Dockerfile.frpc
    steps:
      - uses: actions/checkout@v4
      - name: Image versions
        id: versions
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMPONENT: ${{ matrix.component }}
        run: |
          version=dev
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#podux-v}"
          fi
          image_version="$version"
          if [ "$COMPONENT" = podux-frpc ]; then
            image_version="0.71.0-podux.$version"
          fi
          echo "panel=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image_version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=raw,value=${{ steps.versions.outputs.image }},enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.versions.outputs.image }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.versions.outputs.panel }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            FRP_VERSION=0.71.0
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
