name: podux-local
services:
  podux:
    image: podux-local:external
    build:
      context: ..
      args:
        VERSION: 0.3.0
    container_name: podux-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:17402:8090"
    volumes:
      - podux-data:/app/pb_data
    env_file: .env.external.local
    environment:
      TZ: Europe/Moscow
      FRPC_API_URL: http://frpc:7400
      FRPC_VERSION: ${FRP_VERSION:-0.71.0}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  frpc:
    image: ghcr.io/fatedier/frpc:v${FRP_VERSION:-0.71.0}
    container_name: podux-frpc
    user: "1000:1000"
    working_dir: /app
    # One frpc per enabled connection (runtime/clients/<id>/); see deploy/frpc-supervisor.sh.
    entrypoint: ["/bin/sh", "/supervisor.sh"]
    healthcheck:
      test: [CMD, /bin/sh, /supervisor.sh, health]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 4
    restart: unless-stopped
    env_file: .env.external.local
    volumes:
      - podux-data:/app/pb_data
      - ./frpc-supervisor.sh:/supervisor.sh:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  podux-data:
