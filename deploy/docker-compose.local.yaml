name: podux-local
services:
  podux:
    image: podux-local:external
    build:
      context: ..
      args:
        VERSION: 0.2.2
    container_name: podux-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:17402:8090"
    volumes:
      - podux-data:/app/pb_data
    env_file: .env.external.local
    environment:
      TZ: Europe/Moscow
      FRPC_API_URL: http://frpc:7400
      FRPC_VERSION: ${FRP_VERSION:-0.71.0}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  frpc:
    image: ghcr.io/fatedier/frpc:v${FRP_VERSION:-0.71.0}
    container_name: podux-frpc
    user: "1000:1000"
    working_dir: /app
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
          while [ ! -s /app/pb_data/runtime/frpc.json ]; do sleep 1; done
          if ! frpc verify -c /app/pb_data/runtime/frpc.json >/dev/null 2>&1; then
            frpc verify -c /app/pb_data/runtime/frpc.previous.json >/dev/null 2>&1 || exit 1
            cp /app/pb_data/runtime/frpc.previous.json /app/pb_data/runtime/frpc.json.next
            mv /app/pb_data/runtime/frpc.json.next /app/pb_data/runtime/frpc.json
            echo "Restored the previous valid FRPC configuration" >&2
          fi
          exec frpc -c /app/pb_data/runtime/frpc.json
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:7400/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 4
    restart: unless-stopped
    env_file: .env.external.local
    volumes:
      - podux-data:/app/pb_data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  podux-data:
