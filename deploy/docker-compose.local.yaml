name: podux-local
services:
  podux:
    image: podux-local:external
    build:
      context: ..
      args:
        VERSION: 0.1.6-external
    container_name: podux-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:17402:8090"
    volumes:
      - podux-data:/app/pb_data
    env_file: .env.external.local
    environment:
      TZ: Europe/Moscow
      FRPC_API_URL: http://frpc:7400
      FRPC_VERSION: ${FRP_VERSION:-0.71.0}
    depends_on:
      frpc:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  frpc:
    image: podux-frpc:${FRP_VERSION:-0.71.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frpc
      args:
        FRP_VERSION: ${FRP_VERSION:-0.71.0}
        FRP_SHA256: ${FRP_SHA256:-}
    container_name: podux-frpc
    restart: unless-stopped
    env_file: .env.external.local
    volumes:
      - podux-data:/app/pb_data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  podux-data:
