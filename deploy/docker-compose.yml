name: podux-local
services:
  podux:
    image: ghcr.io/vitalyor/podux:${PODUX_VERSION:-0.2.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:17402:8090"
    volumes:
      - podux-data:/app/pb_data
    env_file: .env.external.local
    environment:
      TZ: Europe/Moscow
      FRPC_API_URL: http://frpc:7400
      FRPC_VERSION: ${FRP_VERSION:-0.71.0}
    depends_on:
      frpc:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  frpc:
    image: ghcr.io/vitalyor/podux-frpc:${FRPC_IMAGE_VERSION:-0.71.0-podux.0.2.0}
    restart: unless-stopped
    env_file: .env.external.local
    volumes:
      - podux-data:/app/pb_data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  podux-data:
